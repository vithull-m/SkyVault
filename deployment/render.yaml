services:
  # 1. Spring Boot Backend Web Service
  # NOTE: MongoDB is not a managed Render service. Use MongoDB Atlas free tier.
  # Set SPRING_DATA_MONGODB_URI to your Atlas connection string.
  - type: web
    name: skyvault-backend
    env: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false   # Set manually in Render dashboard to your MongoDB Atlas URI
      - key: JWT_SECRET
        generateValue: true

  # 2. Python AI Anomaly Service
  - type: web
    name: skyvault-ai-service
    env: docker
    dockerfilePath: ./apps/ai-service/Dockerfile
    dockerContext: ./apps/ai-service
    plan: free

  # 3. React Frontend Web Service
  - type: web
    name: skyvault-frontend
    env: docker
    dockerfilePath: ./apps/frontend/Dockerfile
    dockerContext: ./apps/frontend
    plan: free
