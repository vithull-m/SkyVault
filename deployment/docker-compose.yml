version: '3.8'

services:
  # =========================================================================
  # 1. Database: MongoDB 7.0
  # =========================================================================
  mongodb:
    image: mongo:7.0
    container_name: skyvault-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-skyvault_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - skyvault-network

  # =========================================================================
  # 2. Core Backend: Spring Boot Service
  # =========================================================================
  skyvault-backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: skyvault-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-skyvault_db}
      SPRING_DATA_MONGODB_AUTO_INDEX_CREATION: "true"
      APP_JWT_SECRET: ${JWT_SECRET:-9a2f8c4e7b1a5d3f8e6c4b2a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e}
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - skyvault-network

  # =========================================================================
  # 3. AI Service: Python FastAPI Anomaly Engine
  # =========================================================================
  skyvault-ai:
    build:
      context: ../apps/ai-service
      dockerfile: Dockerfile
    container_name: skyvault-ai
    restart: always
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8082
      BACKEND_URL: http://skyvault-backend:8080
    ports:
      - "8082:8082"
    volumes:
      - ai_logs:/app/logs
    networks:
      - skyvault-network

  # =========================================================================
  # 4. Frontend: React Vite SPA + Nginx Reverse Proxy
  # =========================================================================
  skyvault-frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: skyvault-frontend
    restart: always
    depends_on:
      - skyvault-backend
    ports:
      - "80:80"
      - "3000:80"
    networks:
      - skyvault-network

volumes:
  mongo_data:
    driver: local
  backend_logs:
    driver: local
  ai_logs:
    driver: local

networks:
  skyvault-network:
    driver: bridge
